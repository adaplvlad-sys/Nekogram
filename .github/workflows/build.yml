name: Build APK

on:
  push:
    branches: [ main, master ]
  workflow_dispatch:

jobs:
  build:
    runs-on: ubuntu-22.04

    steps:
    - name: Checkout Repository with Submodules
      uses: actions/checkout@v4
      with:
        submodules: recursive
        fetch-depth: 0

    - name: Set up JDK 17
      uses: actions/setup-java@v4
      with:
        java-version: '17'
        distribution: 'temurin'

    - name: Kill Navigation Plugin
      run: |
        find . -name "build.gradle*" -exec sed -i '/androidx.navigation.safeargs/d' {} + || true
        find . -name "build.gradle*" -exec sed -i '/navigation.safeargs/d' {} + || true

    - name: Grant execute permission for gradlew
      run: chmod +x gradlew

    - name: Show available tasks (СПИСОК ЗАДАЧ)
      run: ./gradlew tasks --all --no-configuration-cache | grep -i assemble || true

    - name: Build with Gradle (пробуем стандартный)
      run: ./gradlew assembleDebug --stacktrace --no-configuration-cache

    - name: Upload APK
      uses: actions/upload-artifact@v4
      with:
        name: app-debug
        path: TMessagesProj/build/outputs/apk/debug/*.apk
