name: Build APK

on:
  push:
    branches: [ main, master ]
  workflow_dispatch:

jobs:
  build:
    runs-on: ubuntu-22.04

    steps:
    - name: Checkout Repository with Submodules
      uses: actions/checkout@v4
      with:
        submodules: recursive
        fetch-depth: 0

    - name: Set up JDK 17
      uses: actions/setup-java@v4
      with:
        java-version: '17'
        distribution: 'temurin'

    - name: Kill Navigation Plugin (фикс Object.toString)
      run: |
        # Ищем все файлы build.gradle* и удаляем оттуда плагин навигации
        find . -name "build.gradle*" -exec sed -i '/androidx.navigation.safeargs/d' {} + || true
        find . -name "build.gradle*" -exec sed -i '/navigation.safeargs/d' {} + || true
        
        # Отключаем само создание навигационных ресурсов
        echo "android.nonTransitiveRClass=true" >> gradle.properties
        echo "android.nonFinalResIds=true" >> gradle.properties

    - name: Grant execute permission for gradlew
      run: chmod +x gradlew

    - name: Build with Gradle
      run: ./gradlew assembleAfatDebug --stacktrace --no-configuration-cache

    - name: Upload APK
      uses: actions/upload-artifact@v4
      with:
        name: app-debug
        path: TMessagesProj/build/outputs/apk/afat/debug/*.apk
