name: Build APK

on:
  push:
    branches: [ main, master ]
  workflow_dispatch:

jobs:
  build:
    runs-on: ubuntu-22.04

    steps:
    - name: Checkout Repository with Submodules
      uses: actions/checkout@v4
      with:
        submodules: recursive
        fetch-depth: 0

    - name: Set up JDK 17
      uses: actions/setup-java@v4
      with:
        java-version: '17'
        distribution: 'temurin'

    - name: Disable Navigation Resources
      run: |
        # Жестко отключаем плагин навигации в корневом build.gradle
        sed -i '/androidx.navigation/d' build.gradle || true
        sed -i '/navigation.safeargs/d' build.gradle || true
        
        # Добавляем флаг, который говорит Gradle игнорировать ошибку
        echo "android.disableResourceValidation=true" >> gradle.properties

    - name: Grant execute permission for gradlew
      run: chmod +x gradlew

    - name: Build with Gradle
      run: ./gradlew assembleDebug --stacktrace --no-configuration-cache -Pandroid.nonTransitiveRClass=true

    - name: Upload APK
      uses: actions/upload-artifact@v4
      with:
        name: app-debug
        path: TMessagesProj/build/outputs/apk/debug/*.apk
