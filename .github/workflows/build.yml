name: Build APK

on:
  push:
    branches: [ main, master ]
  workflow_dispatch:

jobs:
  build:
    runs-on: ubuntu-22.04

    steps:
    - name: Checkout Repository with Submodules
      uses: actions/checkout@v4
      with:
        submodules: recursive
        fetch-depth: 0

    - name: Set up JDK 17
      uses: actions/setup-java@v4
      with:
        java-version: '17'
        distribution: 'temurin'

    - name: Disable Android Test Plugin & Fix Kotlin
      run: |
        # 1. Убираем плагин com.android.test, который требует Gradle 9.6
        sed -i 's/id("com.android.test")/\/\/ id("com.android.test")/g' baselineprofile/build.gradle || true
        sed -i 's/id("com.android.test")/\/\/ id("com.android.test")/g' baselineprofile/build.gradle.kts || true
        
        # 2. Убираем требование Kotlin 2.2 (чтобы 8.7 не ругался)
        sed -i '/KOTLIN_2_2/d' build-logic/convention/build.gradle.kts || true
        sed -i 's/KotlinVersion.KOTLIN_2_2/KotlinVersion.KOTLIN_1_9/g' build-logic/convention/build.gradle.kts || true

    - name: Grant execute permission for gradlew
      run: chmod +x gradlew

    - name: Build with Gradle
      run: ./gradlew assembleAfatDebug --stacktrace

    - name: Upload APK
      uses: actions/upload-artifact@v4
      with:
        name: app-debug
        path: TMessagesProj/build/outputs/apk/afat/debug/*.apk
